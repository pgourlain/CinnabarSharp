<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0553F"/>
      <stop offset="1" stop-color="#A8261B"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <!-- pixel grid hint -->
  <g fill="#FFFFFF">
    <rect x="190" y="190" width="60" height="60" rx="12" opacity="0.95"/>
    <rect x="266" y="190" width="60" height="60" rx="12" opacity="0.6"/>
    <rect x="190" y="266" width="60" height="60" rx="12" opacity="0.6"/>
    <rect x="266" y="266" width="60" height="60" rx="12" opacity="0.3"/>
  </g>
  <!-- paint stroke, ending under the brush tip -->
  <path d="M200 720 C 320 590, 450 790, 580 640 S 700 470, 700 470"
        fill="none" stroke="url(#stroke)" stroke-width="96" stroke-linecap="round"/>
  <!-- brush: tip at (720, 450), pointing down-left -->
  <g transform="translate(720 450) rotate(40)">
    <rect x="-30" y="-420" width="60" height="250" rx="28" fill="#3B2A24"/>
    <rect x="-40" y="-190" width="80" height="70" rx="10" fill="#E6E6E6"/>
    <rect x="-40" y="-165" width="80" height="10" fill="#B5B5B5"/>
    <path d="M-40 -120 H40 C40 -60 12 -20 0 0 C-12 -20 -40 -60 -40 -120 Z" fill="#7A1A12"/>
  </g>
</svg>
