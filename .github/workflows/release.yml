name: Release

# Push a tag like v0.1.0 to build unsigned packages for every OS and attach them to a GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (e.g. 0.1.0); creates a draft release
        required: true

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64, os: windows-latest }
          - { rid: linux-x64, os: ubuntu-latest }
          - { rid: osx-arm64, os: macos-latest }
          - { rid: osx-x64, os: macos-latest }
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Version
        id: version
        shell: bash
        run: echo "value=${{ inputs.version || github.ref_name }}" | sed 's/=v/=/' >> "$GITHUB_OUTPUT"

      - name: Test
        run: dotnet test CinnabarSharp.slnx --configuration Release

      # Native AOT links with the platform toolchain (macOS: Xcode, Windows: MSVC, both on the runners).
      - name: Native AOT prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Package
        shell: bash
        run: packaging/package.sh ${{ matrix.rid }} ${{ steps.version.outputs.value }} artifacts

      # Every MCP tool, every effect and every file format, run on the packaged app: no release with a broken build.
      - name: Smoke test the packaged app
        shell: bash
        run: packaging/smoke-test.sh ${{ matrix.rid }} ${{ steps.version.outputs.value }} artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.rid }}
          path: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/*.dmg

  # Arch / Omarchy package built from the Linux tarball above.
  arch:
    needs: package
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm git

      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: package-linux-x64
          path: dist

      - name: Build package
        shell: bash
        run: |
          version="${{ inputs.version || github.ref_name }}"
          version="${version#v}"
          useradd -m builder
          mkdir /home/builder/pkg
          cp packaging/arch/PKGBUILD "dist/CinnabarSharp-$version-linux-x64.tar.gz" /home/builder/pkg/
          chown -R builder /home/builder/pkg
          su builder -c "cd /home/builder/pkg && CINNABARSHARP_VERSION=$version makepkg -f --noconfirm --nodeps"
          mkdir out && cp /home/builder/pkg/*.pkg.tar.zst out/

      - uses: actions/upload-artifact@v7
        with:
          name: package-arch
          path: out/*.pkg.tar.zst

  release:
    needs: [package, arch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}"
          draft="${{ inputs.version && '--draft' || '' }}"
          # A version with a suffix (0.7.0-rc) is a pre-release.
          pre=""; case "$tag" in *-*) pre="--prerelease" ;; esac
          gh release create "$tag" dist/* --repo "${{ github.repository }}" --title "CinnabarSharp ${tag#v}" \
            --target "${{ github.sha }}" $draft $pre --notes-file packaging/release-notes.md
