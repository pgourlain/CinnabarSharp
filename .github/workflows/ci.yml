name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build CinnabarSharp.slnx --configuration Release

      - name: Test
        run: dotnet test CinnabarSharp.slnx --configuration Release --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ matrix.os }}
          path: CinnabarSharp.Desktop.Tests/bin/Release/net10.0/screenshots

  # The macOS package must hold only arm64 code (no "Intel-based app" warning).
  macos-arm64-package:
    runs-on: macos-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Package osx-arm64
        run: packaging/package.sh osx-arm64 0.0.0-ci artifacts

      - name: Check Mach-O architectures
        run: packaging/check-macho-archs.sh artifacts/CinnabarSharp-0.0.0-ci-osx-arm64/CinnabarSharp.app arm64
