<svg xmlns="http://www.w3.org/2000/svg" width="200" height="100" viewBox="0 0 200 100">
  <defs>
    <clipPath id="cp1"><circle cx="40" cy="50" r="30"/></clipPath>
    <clipPath id="cp2" clipPathUnits="objectBoundingBox"><rect x="0" y="0" width="0.5" height="1"/></clipPath>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000"/>
      <stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <mask id="m1"><rect x="110" y="10" width="80" height="80" fill="url(#fade)"/></mask>
  </defs>
  <rect x="0" y="0" width="80" height="100" fill="#d04020" clip-path="url(#cp1)"/>
  <rect x="85" y="5" width="20" height="90" fill="#2040d0" clip-path="url(#cp2)"/>
  <rect x="110" y="10" width="80" height="80" fill="#20a020" mask="url(#m1)"/>
</svg>
